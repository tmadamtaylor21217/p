# P 配置文件

# 默认打开方式（可选: claude, cursor, code, windsurf, trae，或自定义命令）
# 用于 p new / p clone / p copy / p recent 等命令创建或打开项目时
# claude 等 AI CLI（终端 TUI）会在项目目录直接启动终端会话
ide: claude

# GUI IDE（p o <项目> 用它打开；留空时自动探测 cursor/code/windsurf/trae）
#editor: cursor

# p new 启动 claude 会话后自动同步到 CCHive 侧栏（写 ~/.claude/cchive.json 目录订阅）
# 设为 false 关闭
cchiveSync: true

# 命令快捷方式（用于 p new -- <别名> <项目名>）
#shortcuts:
#  heroui: npx -y heroui-cli@latest init
#  next: npx -y create-next-app@latest

# Hooks 定义（在根节点声明，供模板引用）
# 每个 hook 可以使用 command（命令）或 file（脚本文件名，必须是 .js）
hooks:
  gitInit:
    name: Git 初始化
    command: git init

  bunInit:
    name: Bun 初始化
    command: bun init -y

  installDeps:
    name: 安装依赖
    command: bun install

  taze:
    name: Taze 递归 major 版本更新
    command: bunx taze major -r -w

  biome:
    name: Biome 初始化
    command: bun add -D --save-exact @biomejs/biome && bunx @biomejs/biome init

  changeset:
    name: Changeset 初始化
    command: bun add -D @changesets/cli && bunx changeset init

  vitest:
    name: 安装 Vitest（React）依赖
    command: bun add -D vitest jsdom @testing-library/react @testing-library/jest-dom

  # 自定义脚本示例（file 必须是 .js 文件）:
  # myScript:
  #   name: 自定义脚本
  #   file: my-script.js

# 模板配置
# 每个模板可以指定需要执行的 hooks 列表（按顺序执行）
# 使用 command（命令）或 dir（本地模板文件夹名）
templates:
  # 空项目模板（p new <name> 的默认配置）
  empty:
    name: 空项目

  shadcn:
    name: shadcn/ui 项目（询问项目名时，输入 . 在项目根目录下创建）
    command: bunx --bun shadcn@latest init

  # 做 npm 包的模板
  bun-npm:
    name: Bun NPM 包
    dir: bun-tsup
    hooks:
      - gitInit

  react:
    name: React (Vite)
    command: bun create vite . --template react-ts --rolldown
    hooks:
      - gitInit
      - installDeps

  next:
    name: Next.js
    command: bunx create-next-app@latest . --yes

  vue:
    name: Vue (Vite)
    command: bun create vite . --template vue-ts --rolldown
    hooks:
      - gitInit
      - installDeps

  remix:
    name: Remix(Docker)
    command: bunx create-react-router@latest . --yes
    hooks:
      - biome

  remix-cf:
    name: Remix(React Router) Cloudflare
    command: bun create react-router@latest . --template https://github.com/remix-run/react-router-templates/tree/main/cloudflare --no-git-init --no-install "--framework=react-router"
    hooks:
      - gitInit
      - biome
      - vitest

  react-router-cf:
    name: React Router v7 + CF Workers
    dir: react-router-cf
    hooks:
      - gitInit

  # 本地模板模式 - 使用 dir 字段（模板文件夹名）
  # custom:
  #   name: 自定义模板
  #   dir: my-template
  #   hooks:
  #     - gitInit
  #     - installDeps

# 额外的文件忽略规则（追加到默认规则之后，用于模板收集和文件遍历）
#ignore:
#  - "*.secret"
#  - ".env.production"

# 局域网同步（p sync export / import，配合 LocalSend 等工具）
#sync:
#  exclude: []
